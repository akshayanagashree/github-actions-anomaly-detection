name: CI Build and Test
"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # MODIFICATION: Replaced pinned tag '@v4' with unpinned mutable branch '@main'
      - name: Check out repository
        uses: actions/checkout@main

      # MODIFICATION: Replaced pinned tag '@v5' with unpinned mutable branch '@main'
      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ --maxfail=1
