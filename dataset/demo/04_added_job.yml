name: CI Build and Test
"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ --maxfail=1

  # MODIFICATION: Newly introduced job on self-hosted runner infrastructure
  publish-metrics:
    name: Telemetry Dispatch
    runs-on: [self-hosted, linux]
    steps:
      - name: Send Run Telemetry
        run: |
          echo "Dispatching run statistics..."
          curl -s https://metrics.example.internal/push
